<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Submitted — MSAG Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0e; color: #e8e8ea; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #141416; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 48px 40px; max-width: 480px; width: 100%; text-align: center; }
    .icon { width: 56px; height: 56px; background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
    .icon svg { width: 26px; height: 26px; stroke: #22c55e; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-family: 'Lexend Deca', sans-serif; font-size: 1.4rem; font-weight: 700; color: #fff; margin-bottom: 10px; }
    p  { font-size: 0.9rem; color: #8a8a94; line-height: 1.7; margin-bottom: 28px; }
    a  { display: inline-flex; align-items: center; gap: 8px; background: #EDF069; color: #0d0d0e; font-family: 'Lexend Deca', sans-serif; font-weight: 700; font-size: 0.88rem; padding: 11px 22px; border-radius: 8px; text-decoration: none; }
    a:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Request Submitted</h1>
    <p>Your request has been received and a task has been created in our project tracker. Check your email for a confirmation with your reference number.</p>
    <a href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Submit Another Request
    </a>
  </div>
</body>
</html>
